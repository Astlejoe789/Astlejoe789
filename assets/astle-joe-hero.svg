<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Unique gradient IDs -->
    <linearGradient id="ajh-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    
    <linearGradient id="ajh-burgundy-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126"/>
      <stop offset="50%" stop-color="#701A3D"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>
    
    <linearGradient id="ajh-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B"/>
      <stop offset="40%" stop-color="#E5B5C7"/>
      <stop offset="60%" stop-color="#F8F0F3"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>
    
    <linearGradient id="ajh-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0"/>
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1"/>
      <stop offset="70%" stop-color="#701A3D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>
    
    <radialGradient id="ajh-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="ajh-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="ajh-node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77B9B"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>
    
    <filter id="ajh-glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="ajh-soft-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="ajh-text-shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#701A3D" flood-opacity="0.5"/>
    </filter>

    <!-- Clip path for border -->
    <clipPath id="ajh-border-clip">
      <rect x="1" y="1" width="898" height="318" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="12" fill="url(#ajh-bg-grad)"/>
  
  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="899" height="319" rx="12" fill="none" stroke="#451126" stroke-opacity="0.4" stroke-width="1"/>

  <g clip-path="url(#ajh-border-clip)">
    
    <!-- Technical grid lines -->
    <g stroke="#451126" stroke-opacity="0.08" stroke-width="0.5">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="0" y1="280" x2="900" y2="280"/>
      <line x1="100" y1="0" x2="100" y2="320"/>
      <line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="300" y1="0" x2="300" y2="320"/>
      <line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="500" y1="0" x2="500" y2="320"/>
      <line x1="600" y1="0" x2="600" y2="320"/>
      <line x1="700" y1="0" x2="700" y2="320"/>
      <line x1="800" y1="0" x2="800" y2="320"/>
    </g>
    
    <!-- Ambient orbs -->
    <circle cx="120" cy="80" r="100" fill="url(#ajh-orb-1)">
      <animate attributeName="r" values="100;120;100" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="240" r="80" fill="url(#ajh-orb-2)">
      <animate attributeName="r" values="80;100;80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="10s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Neural network connections — left cluster -->
    <g stroke="#701A3D" stroke-opacity="0.2" stroke-width="0.8">
      <!-- Layer 1 to Layer 2 -->
      <line x1="60" y1="70" x2="140" y2="50">
        <animate attributeName="stroke-opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="70" x2="140" y2="100">
        <animate attributeName="stroke-opacity" values="0.15;0.3;0.15" dur="5s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="130" x2="140" y2="100">
        <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="130" x2="140" y2="150">
        <animate attributeName="stroke-opacity" values="0.12;0.28;0.12" dur="6s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="190" x2="140" y2="150">
        <animate attributeName="stroke-opacity" values="0.1;0.32;0.1" dur="4.5s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="190" x2="140" y2="200">
        <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="5.5s" repeatCount="indefinite"/>
      </line>
      <!-- Layer 2 to Layer 3 -->
      <line x1="140" y1="50" x2="210" y2="95">
        <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="4.2s" repeatCount="indefinite"/>
      </line>
      <line x1="140" y1="100" x2="210" y2="95">
        <animate attributeName="stroke-opacity" values="0.12;0.35;0.12" dur="3.8s" repeatCount="indefinite"/>
      </line>
      <line x1="140" y1="150" x2="210" y2="165">
        <animate attributeName="stroke-opacity" values="0.1;0.28;0.1" dur="5.2s" repeatCount="indefinite"/>
      </line>
      <line x1="140" y1="200" x2="210" y2="165">
        <animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="4.8s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Neural nodes — left -->
    <g filter="url(#ajh-glow-filter)">
      <circle cx="60" cy="70" r="3" fill="url(#ajh-node-grad)" opacity="0.7">
        <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="130" r="2.5" fill="url(#ajh-node-grad)" opacity="0.6">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="190" r="3" fill="url(#ajh-node-grad)" opacity="0.65">
        <animate attributeName="r" values="3;4;3" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="50" r="2.5" fill="url(#ajh-node-grad)" opacity="0.6">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="100" r="3" fill="url(#ajh-node-grad)" opacity="0.7">
        <animate attributeName="r" values="3;4;3" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="150" r="2.5" fill="url(#ajh-node-grad)" opacity="0.55">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="200" r="3" fill="url(#ajh-node-grad)" opacity="0.6">
        <animate attributeName="r" values="3;4;3" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="95" r="3.5" fill="url(#ajh-node-grad)" opacity="0.75">
        <animate attributeName="r" values="3.5;5;3.5" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="165" r="3" fill="url(#ajh-node-grad)" opacity="0.65">
        <animate attributeName="r" values="3;4.5;3" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Neural network connections — right cluster -->
    <g stroke="#701A3D" stroke-opacity="0.2" stroke-width="0.8">
      <line x1="700" y1="110" x2="770" y2="80">
        <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/>
      </line>
      <line x1="700" y1="110" x2="770" y2="140">
        <animate attributeName="stroke-opacity" values="0.12;0.35;0.12" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="700" y1="180" x2="770" y2="140">
        <animate attributeName="stroke-opacity" values="0.1;0.28;0.1" dur="4.5s" repeatCount="indefinite"/>
      </line>
      <line x1="700" y1="180" x2="770" y2="210">
        <animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <line x1="700" y1="250" x2="770" y2="210">
        <animate attributeName="stroke-opacity" values="0.1;0.32;0.1" dur="5.5s" repeatCount="indefinite"/>
      </line>
      <line x1="770" y1="80" x2="840" y2="130">
        <animate attributeName="stroke-opacity" values="0.12;0.35;0.12" dur="4.2s" repeatCount="indefinite"/>
      </line>
      <line x1="770" y1="140" x2="840" y2="130">
        <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="3.8s" repeatCount="indefinite"/>
      </line>
      <line x1="770" y1="210" x2="840" y2="200">
        <animate attributeName="stroke-opacity" values="0.15;0.38;0.15" dur="5s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Neural nodes — right -->
    <g filter="url(#ajh-glow-filter)">
      <circle cx="700" cy="110" r="2.5" fill="url(#ajh-node-grad)" opacity="0.6">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="180" r="3" fill="url(#ajh-node-grad)" opacity="0.65">
        <animate attributeName="r" values="3;4;3" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="250" r="2.5" fill="url(#ajh-node-grad)" opacity="0.55">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="80" r="3" fill="url(#ajh-node-grad)" opacity="0.7">
        <animate attributeName="r" values="3;4;3" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="140" r="2.5" fill="url(#ajh-node-grad)" opacity="0.6">
        <animate attributeName="r" values="2.5;3.5;2.5" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="210" r="3" fill="url(#ajh-node-grad)" opacity="0.7">
        <animate attributeName="r" values="3;4;3" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="840" cy="130" r="3.5" fill="url(#ajh-node-grad)" opacity="0.75">
        <animate attributeName="r" values="3.5;5;3.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="840" cy="200" r="3" fill="url(#ajh-node-grad)" opacity="0.65">
        <animate attributeName="r" values="3;4.5;3" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Flowing data path -->
    <path d="M 0 200 C 150 180, 250 220, 350 190 S 550 160, 650 195 S 800 230, 900 200" 
          fill="none" stroke="url(#ajh-burgundy-grad)" stroke-width="1" stroke-opacity="0.25">
      <animate attributeName="d" 
               values="M 0 200 C 150 180, 250 220, 350 190 S 550 160, 650 195 S 800 230, 900 200;
                       M 0 205 C 150 225, 250 185, 350 215 S 550 245, 650 210 S 800 175, 900 205;
                       M 0 200 C 150 180, 250 220, 350 190 S 550 160, 650 195 S 800 230, 900 200"
               dur="12s" repeatCount="indefinite"/>
    </path>
    
    <!-- Second flowing path -->
    <path d="M 0 260 C 200 240, 300 280, 450 250 S 650 220, 750 255 S 850 290, 900 260" 
          fill="none" stroke="#701A3D" stroke-width="0.6" stroke-opacity="0.15">
      <animate attributeName="d" 
               values="M 0 260 C 200 240, 300 280, 450 250 S 650 220, 750 255 S 850 290, 900 260;
                       M 0 255 C 200 275, 300 245, 450 270 S 650 300, 750 265 S 850 230, 900 255;
                       M 0 260 C 200 240, 300 280, 450 250 S 650 220, 750 255 S 850 290, 900 260"
               dur="15s" repeatCount="indefinite"/>
    </path>

    <!-- Floating data points along path -->
    <circle r="1.5" fill="#C77B9B" opacity="0.6">
      <animateMotion dur="8s" repeatCount="indefinite" 
        path="M 0 200 C 150 180, 250 220, 350 190 S 550 160, 650 195 S 800 230, 900 200"/>
    </circle>
    <circle r="1" fill="#E5B5C7" opacity="0.4">
      <animateMotion dur="10s" repeatCount="indefinite" begin="2s"
        path="M 0 260 C 200 240, 300 280, 450 250 S 650 220, 750 255 S 850 290, 900 260"/>
    </circle>

    <!-- Mathematical accent marks -->
    <g font-family="'Courier New', monospace" font-size="10" fill="#451126" fill-opacity="0.15">
      <text x="30" y="290">∑</text>
      <text x="120" y="260">∇</text>
      <text x="750" y="55">θ</text>
      <text x="830" y="280">∂</text>
      <text x="680" y="290">λ</text>
      <text x="50" y="45">σ</text>
    </g>

    <!-- Main title -->
    <text x="450" y="125" 
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" 
          font-weight="700" 
          fill="url(#ajh-text-grad)" 
          text-anchor="middle" 
          letter-spacing="6"
          filter="url(#ajh-text-shadow)">
      ASTLE JOE A S
    </text>
    
    <!-- Glowing underline -->
    <rect x="240" y="142" width="420" height="2" rx="1" fill="url(#ajh-glow-line)" filter="url(#ajh-soft-glow)">
      <animate attributeName="width" values="420;440;420" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="240;230;240" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Subtitle -->
    <text x="450" y="180" 
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
          font-size="14" 
          font-weight="400" 
          fill="#C77B9B" 
          text-anchor="middle" 
          letter-spacing="5"
          opacity="0.85">
      ASPIRING MACHINE LEARNING ENGINEER
    </text>
    
    <!-- Thin accent line below subtitle -->
    <line x1="340" y1="195" x2="560" y2="195" stroke="#451126" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Decorative corner accents -->
    <g stroke="#701A3D" stroke-opacity="0.3" stroke-width="1">
      <line x1="15" y1="15" x2="50" y2="15"/>
      <line x1="15" y1="15" x2="15" y2="50"/>
      <line x1="885" y1="15" x2="850" y2="15"/>
      <line x1="885" y1="15" x2="885" y2="50"/>
      <line x1="15" y1="305" x2="50" y2="305"/>
      <line x1="15" y1="305" x2="15" y2="270"/>
      <line x1="885" y1="305" x2="850" y2="305"/>
      <line x1="885" y1="305" x2="885" y2="270"/>
    </g>
    
    <!-- Small corner dots -->
    <circle cx="15" cy="15" r="2" fill="#701A3D" opacity="0.5"/>
    <circle cx="885" cy="15" r="2" fill="#701A3D" opacity="0.5"/>
    <circle cx="15" cy="305" r="2" fill="#701A3D" opacity="0.5"/>
    <circle cx="885" cy="305" r="2" fill="#701A3D" opacity="0.5"/>
    
  </g>
</svg>
